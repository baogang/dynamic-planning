services:
  - type: web
    name: dynamic-planning
    runtime: python
    region: singapore
    plan: free
    buildCommand: python -m unittest discover -s tests -v
    startCommand: python -m agentlab serve --host 0.0.0.0
    healthCheckPath: /health
    autoDeployTrigger: commit
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.12
      - key: PYTHONUNBUFFERED
        value: "1"
      - key: AGENTLAB_API_TOKEN
        generateValue: true
